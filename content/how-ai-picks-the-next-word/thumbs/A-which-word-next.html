<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1280px;height:720px;overflow:hidden;background:#05070F}
.t{position:relative;width:1280px;height:720px;background:radial-gradient(ellipse at 70% 35%,#2a1d4d 0%,#120f26 55%,#05070F 100%);font-family:'Inter',sans-serif;color:#F5F7FF}
.kick{position:absolute;left:44px;top:30px;font-weight:800;font-size:30px;letter-spacing:.14em;color:#C4B5FD;text-transform:uppercase}
.big{font-family:'Anton',sans-serif;text-transform:uppercase;line-height:.92}
.chip{display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;border-radius:18px;padding:0 22px;color:#F5F7FF}
</style></head><body><div class="t"><div class="kick">How AI writes</div>
<div class="big" style="position:absolute;left:44px;top:78px;font-size:132px">WHICH WORD <span style="color:#FBBF24">NEXT?</span></div>
<div style="position:absolute;left:44px;top:232px;font-weight:800;font-size:46px">Once upon a time, there was a <span style="display:inline-block;width:150px;height:56px;border:4px dashed #F5F7FF;border-radius:14px;vertical-align:middle"></span></div>
<div style="position:absolute;left:44px;top:330px;display:flex;align-items:center;gap:22px">
  <div class="chip" style="width:250px;height:92px;font-size:52px;background:#A78BFA33;border:4px solid #A78BFA">young</div>
  <div style="width:560px;height:76px;border-radius:14px;background:#A78BFA"></div>
  <div class="big" style="font-size:84px">30%</div></div><div style="position:absolute;left:44px;top:450px;display:flex;align-items:center;gap:22px">
  <div class="chip" style="width:250px;height:92px;font-size:52px;background:#22D3EE33;border:4px solid #22D3EE">little</div>
  <div style="width:320px;height:76px;border-radius:14px;background:#22D3EE"></div>
  <div class="big" style="font-size:84px">17%</div></div><div style="position:absolute;left:44px;top:570px;display:flex;align-items:center;gap:22px">
  <div class="chip" style="width:250px;height:92px;font-size:52px;background:#A3E63533;border:4px solid #A3E635">curious</div>
  <div style="width:259px;height:76px;border-radius:14px;background:#A3E635"></div>
  <div class="big" style="font-size:84px">14%</div></div>
</div></body></html>
