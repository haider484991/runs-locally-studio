<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1280px;height:720px;overflow:hidden;background:#05070F}
.t{position:relative;width:1280px;height:720px;background:radial-gradient(ellipse at 70% 35%,#2a1d4d 0%,#120f26 55%,#05070F 100%);font-family:'Inter',sans-serif;color:#F5F7FF}
.kick{position:absolute;left:44px;top:30px;font-weight:800;font-size:30px;letter-spacing:.14em;color:#C4B5FD;text-transform:uppercase}
.big{font-family:'Anton',sans-serif;text-transform:uppercase;line-height:.92}
.chip{display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;border-radius:18px;padding:0 22px;color:#F5F7FF}
</style></head><body><div class="t"><div class="kick">Real scores, local AI</div>

<div style="position:absolute;left:44px;top:440px;display:flex;gap:18px;align-items:center"><div class="chip" style="height:96px;font-size:54px;background:#FBBF2433;border:4px solid #FBBF24">young</div><div class="chip" style="height:96px;font-size:54px;background:#FBBF2433;border:4px solid #FBBF24">adventurer</div><div class="chip" style="height:96px;font-size:54px;background:#FBBF2433;border:4px solid #FBBF24">named</div><div class="chip" style="height:96px;font-size:54px;background:#FBBF2433;border:4px solid #FBBF24">Lily</div><div class="big" style="font-size:110px;color:#C4B5FD">&#8635;</div></div>
<div style="position:absolute;left:44px;top:590px;font-weight:800;font-size:40px;color:#8B93A7">one chip at a time</div>
</div></body></html>
